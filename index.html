<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    :root {
      --bg-dark: #070a13;
      --primary: #00d26a;
      --primary-glow: rgba(0, 210, 106, 0.4);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: var(--primary-glow);
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
    }
    .orb-2 {
      width: 250px;
      height: 250px;
      background: rgba(56, 189, 248, 0.2);
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
    }

    .splash-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Glowing Animated Brand Icon */
    .brand-icon-wrapper {
      position: relative;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 78px;
      height: 78px;
      background: linear-gradient(135deg, #00d26a, #008744);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      color: #fff;
      box-shadow: 0 14px 35px var(--primary-glow);
      animation: pulseBrand 2.4s infinite ease-in-out;
    }

    @keyframes pulseBrand {
      0% {
        transform: scale(1);
        box-shadow: 0 14px 35px var(--primary-glow);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 20px 45px rgba(0, 210, 106, 0.65);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 14px 35px var(--primary-glow);
      }
    }

    .brand-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-tagline {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 40px;
      font-weight: 500;
    }

    /* Modern Loader Bar */
    .progress-container {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #38bdf8, var(--primary));
      border-radius: 10px;
      animation: indeterminateLoading 1.4s infinite ease-in-out;
    }

    @keyframes indeterminateLoading {
      0% {
        left: -40%;
        width: 40%;
      }
      50% {
        left: 30%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 40%;
      }
    }

    .status-text {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.5px;
      font-weight: 600;
      transition: all 0.3s;
    }

    /* Bottom Secured Badge */
    .security-badge {
      position: absolute;
      bottom: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #475569;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .security-badge i {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="splash-container">
    <div class="brand-icon-wrapper">
      <div class="brand-icon">
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <h1 class="brand-title">NexusPay</h1>
    <p class="brand-tagline">Next-Gen Rewards & Micro-Task Platform</p>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div class="status-text" id="statusMsg">Connecting to server...</div>
  </div>

  <div class="security-badge">
    <i class="fa-solid fa-shield-halved"></i>
    <span>Encrypted & Secured</span>
  </div>

  <script>
    const statusMsg = document.getElementById('statusMsg');

    // Slight delay (minimum 1.2s) ensures a smooth, non-flickering splash transition
    const splashStartTime = Date.now();
    const MIN_SPLASH_DURATION = 1200;

    auth.onAuthStateChanged(user => {
      statusMsg.textContent = "Verifying session...";
      
      const elapsed = Date.now() - splashStartTime;
      const remainingTime = Math.max(0, MIN_SPLASH_DURATION - elapsed);

      setTimeout(() => {
        if (user) {
          statusMsg.textContent = "Welcome back! Redirecting...";
          window.location.replace("home.html");
        } else {
          statusMsg.textContent = "Redirecting to login...";
          window.location.replace("login.html");
        }
      }, remainingTime);
    });

    // Fallback safety: If network latency delays Firebase callback
    setTimeout(() => {
      if (!auth.currentUser) {
        window.location.replace("login.html");
      }
    }, 4500);
  </script>
</body>
</html>
