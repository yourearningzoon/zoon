<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Login | NexusPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    :root {
      --bg-dark: #070a13;
      --card-bg: rgba(18, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #00d26a;
      --primary-glow: rgba(0, 210, 106, 0.35);
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --input-bg: rgba(11, 17, 32, 0.9);
      --input-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      background: var(--primary-glow);
      top: -80px;
      right: -80px;
    }
    .orb-2 {
      width: 280px;
      height: 280px;
      background: rgba(56, 189, 248, 0.2);
      bottom: -60px;
      left: -60px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 38px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #00d26a, #008744);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 10px 25px var(--primary-glow);
      margin-bottom: 14px;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .alert.danger {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      color: #64748b;
      font-size: 16px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-control {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      padding: 15px 46px 15px 44px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .input-control:focus + .input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #fff;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -6px;
      margin-bottom: 22px;
      font-size: 13.5px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      color: var(--text-muted);
      gap: 8px;
    }

    .checkbox-container input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }

    .custom-box {
      width: 18px;
      height: 18px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .checkbox-container input:checked ~ .custom-box {
      background: var(--primary);
      border-color: var(--primary);
    }

    .custom-box i {
      color: #000;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .checkbox-container input:checked ~ .custom-box i {
      opacity: 1;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00d26a, #00ab55);
      border: none;
      border-radius: 14px;
      padding: 15px;
      color: #032210;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--primary-glow);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 210, 106, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      margin-left: 5px;
      transition: text-shadow 0.2s;
    }

    .footer-link a:hover {
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(0,0,0,0.2);
      border-top-color: #032210;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-container">
    <div class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Enter your credentials to access your dashboard</p>
    </div>

    <div id="alertBox" class="alert danger">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="alertMsg">Invalid credentials</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <div class="input-wrapper">
          <input type="tel" id="mobile" class="input-control" placeholder="01XXXXXXXXX" required>
          <i class="fa-solid fa-phone input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="input-control" placeholder="••••••••" required>
          <i class="fa-solid fa-lock input-icon"></i>
          <span class="toggle-password" id="togglePassword">
            <i class="fa-regular fa-eye" id="toggleIcon"></i>
          </span>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe" checked>
          <span class="custom-box"><i class="fa-solid fa-check"></i></span>
          Remember Me
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Sign In</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>
    </form>

    <div class="footer-link">
      Don't have an account? <a href="register.html">Create One</a>
    </div>
  </div>

  <script>
    // Auto-redirect if already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace("home.html");
      }
    });

    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    // Form Submissions
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');

    function showError(msg) {
      alertMsg.textContent = msg;
      alertBox.style.display = 'flex';
      setLoading(false);
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';
      } else {
        btnText.style.display = 'block';
        btnSpinner.style.display = 'none';
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const mobile = document.getElementById('mobile').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // Validation
      if (mobile.length < 10) {
        showError("Please enter a valid mobile number.");
        return;
      }

      setLoading(true);

      try {
        // Set persistence based on Remember Me
        const persistence = rememberMe
          ? firebase.auth.Auth.Persistence.LOCAL
          : firebase.auth.Auth.Persistence.SESSION;

        await auth.setPersistence(persistence);

        // Convert phone number to system email and authenticate
        const systemEmail = phoneToEmail(mobile);
        await auth.signInWithEmailAndPassword(systemEmail, password);

        // Success redirect handled by auth listener, with fallback
        window.location.href = "home.html";
      } catch (err) {
        console.error(err);
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-login-credentials' || err.code === 'auth/invalid-credential') {
          showError("Invalid mobile number or password.");
        } else {
          showError(err.message || "Login failed. Please try again.");
        }
      }
    });
  </script>
</body>
</html>
